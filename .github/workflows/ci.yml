name: CI

on:
  pull_request:
  workflow_call: {} # lets release.yml reuse this exact CI

# Read-only is enough for CI. When called by release.yml, a reusable workflow can
# request at most the permissions its caller grants, so keeping this minimal here
# keeps the reused CI job read-only; release.yml grants more only on its own
# publish job.
permissions:
  contents: read

# Every job runs on `vars.CI_RUNNER`, defaulting to GitHub's hosted runners when
# the variable is unset. Set it to `self-hosted` to run checks on the registered
# Mac runner, and clear it to fall straight back to hosted — a laptop that is
# closed should cost a `gh variable delete`, not a workflow edit and a PR:
#
#   gh variable set CI_RUNNER --body self-hosted     # local
#   gh variable delete CI_RUNNER                     # back to ubuntu-latest
#
# Self-hosted runners on a *public* repo execute PR code on the host, so this
# stays paired with the Actions setting requiring approval for all external
# contributors' workflow runs.
jobs:
  cli:
    name: CLI typecheck + tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          # corepack provisions pnpm; skip setup-node's auto pnpm cache,
          # which would invoke pnpm before corepack enable puts it on PATH.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm --filter @ichintansoni/skills-master typecheck
      - run: pnpm --filter @ichintansoni/skills-master test:coverage
      # Coverage is reported, not gated: a threshold that fails the build tends
      # to get met with tests written for the number. Putting it in the job
      # summary keeps the gaps visible on every PR instead.
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  # The release workflow silently stopped publishing for five merges because a
  # credential line used single quotes, so `${NODE_AUTH_TOKEN}` never expanded.
  # shellcheck flags exactly that (SC2016) — nothing was running it. Workflows
  # only execute on main, so a linter is the one chance to catch them in review.
  workflows:
    name: Lint GitHub Actions workflows
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      # pyflakes lints inline `python` steps, of which these workflows have
      # none. Left on, the action pip-installs it — which on a self-hosted
      # runner means mutating the host to lint nothing.
      - uses: raven-actions/actionlint@v2
        with:
          pyflakes: false

  # Our snapshot tests pin what we expect the emitters to write — our own
  # expectations agreeing with themselves. This job pins what the Agent Skills
  # specification expects, by running its reference implementation over the
  # committed projections, so an emitter change cannot quietly drift off-spec.
  # Only emitted output is checked: canonical skills/ is deliberately a superset
  # (globs, tags, x-skills-master) and does not validate. See docs/emitters.md.
  spec:
    name: Agent Skills spec conformance
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Pinned: an unpinned validator turns an upstream edit into a red build on
      # an unrelated PR. Bumping the pin is a deliberate change, reviewed here.
      - run: pip install skills-ref==0.1.1
      - run: python3 scripts/spec-validate.py

  content:
    name: Lint skills + registry/taxonomy/marketplace drift
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          # corepack provisions pnpm; skip setup-node's auto pnpm cache,
          # which would invoke pnpm before corepack enable puts it on PATH.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Validate every skill (names, descriptions, pairs_with integrity, body cap, headings).
      - run: pnpm --filter @ichintansoni/skills-master exec tsx src/bin.ts lint --content ../../skills
      # Fail if the committed registry.json is stale.
      - run: pnpm --filter @ichintansoni/skills-master exec tsx src/bin.ts registry build --content ../../skills --check
      # Fail if docs/taxonomy.md no longer matches the registry. It is generated,
      # and went stale for 9 skills and two whole categories before this gate.
      - run: node scripts/gen-taxonomy.mjs --check
      # Fail if the committed plugins/ + .claude-plugin/ output is stale. These
      # ship via `/plugin install`, and drifted by 9 missing skills (plus 3 left
      # behind by a class move) before this gate existed.
      - run: pnpm --filter @ichintansoni/skills-master exec tsx src/bin.ts marketplace build --content ../../skills --out ../.. --check
