name: Release

# Release only when the *published artifact* can actually differ.
#
# The npm package is content-free: `files` is ["dist", "README.md", "LICENSE"],
# so a tarball is dist/bin.js + the two docs. Skills never travel through npm —
# the CLI fetches them at runtime from github:…/skills#main
# (packages/cli/src/content/source.ts), and the Claude marketplace reads the
# committed .claude-plugin/ + plugins/ off main. Both are live the moment a PR
# merges, with or without a release.
#
# Publishing on every push therefore shipped mostly nothing: 0.3.9 through
# 0.3.17 are byte-identical apart from `var version = "…"`, ~73% of merges never
# touch packages/cli/, and 2026-08-27 produced 30 releases in a day.
#
# Each path below is here because it can change what a user installs:
#   packages/cli/**  the only source of dist/bin.js
#   pnpm-lock.yaml   runtime deps (zod, commander, …) are external, not bundled,
#   package.json     so a bump changes the install without changing bin.js
# Tests are excluded — `files` cannot carry them into the tarball.
#
# workflow_dispatch is the manual override: release on demand, and the escape
# hatch if this filter ever proves too narrow.
on:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "!packages/cli/test/**"
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:

# Serialize releases so two quick merges can't both try to tag/publish the same
# version. A later push waits for the in-flight release to finish.
concurrency:
  group: release
  cancel-in-progress: false

# Apply least-privilege defaults to all jobs (notably the reusable `ci` job).
# Jobs that need more access can override at job scope (see `release` below).
permissions:
  contents: read
  packages: read

jobs:
  # Reuse the exact same CI that gates PRs. The release job runs only if it passes.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Version, tag, release, publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tag + create GitHub Release
      packages: write # publish to GitHub Packages
      id-token: write # OIDC trusted publishing + provenance on the npmjs publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history...
          fetch-tags: true # ...and all tags to find the latest version.

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
          scope: "@ichintansoni"

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # Decide the next version from the latest tag + head commit message.
      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          TAG_VER="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          TAG_VER="${TAG_VER#v}"

          # Tags are the intended source of truth, but they are written *after*
          # the publish steps — so a publish that succeeded and then failed later
          # in the job leaves the registry ahead of the tags. Baseline on the
          # higher of the two, otherwise the next run recomputes a version npmjs
          # already has, pnpm silently skips the publish as a duplicate, and we
          # tag a release whose tarball is stale.
          PUB_VER="$(npm view @ichintansoni/skills-master version \
            --registry=https://registry.npmjs.org 2>/dev/null || true)"

          if [ -n "$TAG_VER" ] && [ -n "$PUB_VER" ]; then
            CURRENT="$(pnpm --filter @ichintansoni/skills-master exec semver "$TAG_VER" "$PUB_VER" | tail -n1)"
          else
            CURRENT="${TAG_VER:-$PUB_VER}"
          fi

          if [ -z "$CURRENT" ]; then
            # First-ever release: publish the package.json baseline as-is.
            NEXT="$(node -p "require('./packages/cli/package.json').version")"
            SOURCE="package.json baseline"
          else
            # Bump level from the head commit message: #major > #minor > patch.
            MSG="$(git log -1 --pretty=%B)"
            if   printf '%s' "$MSG" | grep -qiE '#major'; then LEVEL="major"
            elif printf '%s' "$MSG" | grep -qiE '#minor'; then LEVEL="minor"
            else LEVEL="patch"
            fi
            NEXT="$(pnpm --filter @ichintansoni/skills-master exec semver -i "$LEVEL" "$CURRENT")"
            SOURCE="$CURRENT (tag ${TAG_VER:-none}, npmjs ${PUB_VER:-none})"
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "Releasing v$NEXT (from $SOURCE)"

      # Write the computed version into package.json so the published tarball
      # carries it. Not committed back to main — git tags are the source of truth.
      # --allow-same-version makes the first (bootstrap) release a no-op when the
      # computed version already equals the package.json baseline (e.g. 0.1.0).
      - name: Set package version (runner only, not committed)
        working-directory: packages/cli
        run: npm version "${{ steps.ver.outputs.next }}" --no-git-tag-version --allow-same-version

      - run: pnpm --filter @ichintansoni/skills-master build

      # Rebuild the Claude marketplace and attach it to the release as an asset.
      - name: Build Claude marketplace
        run: pnpm --filter @ichintansoni/skills-master exec tsx src/bin.ts marketplace build --content ../../skills --out ../..
      - name: Zip marketplace
        run: zip -r claude-marketplace.zip .claude-plugin plugins

      # Publish FIRST, tag/release LAST: a registry that rejects the publish then
      # leaves no tag or release behind, so a re-run (after fixing the cause)
      # starts from a clean slate instead of colliding with an existing tag.
      #
      # Dual publish: the same scoped package to npmjs (public install) and to
      # GitHub Packages (lights up the repo's Packages sidebar).
      #
      # npmjs authenticates by OIDC trusted publishing — no token. pnpm exchanges
      # the `id-token: write` credential above for a short-lived registry token.
      # The trusted publisher registered on npmjs pins this exact workflow
      # *filename*, so renaming release.yml breaks publishing until the connection
      # is recreated (its fields are immutable — you delete and re-add).
      #
      # This replaced a long-lived NPM_TOKEN that expired silently at 90 days and
      # failed three releases with an opaque `E404 PUT`; an OIDC exchange has no
      # expiry to miss. Provenance is automatic under trusted publishing, so
      # `--provenance` is now belt-and-braces rather than load-bearing.
      #
      # setup-node's `registry-url` seeds the user npmrc with a literal
      # `_authToken=${NODE_AUTH_TOKEN}`. With no NODE_AUTH_TOKEN in this step's
      # env, pnpm would fail expanding it while loading config — before it ever
      # reaches the publish. Dropping the key is what keeps that from happening,
      # so this delete is load-bearing despite looking like dead cleanup.
      - name: Publish to npmjs
        run: |
          set -euo pipefail
          npm config --location=user set "@ichintansoni:registry=https://registry.npmjs.org"
          npm config --location=user delete "//registry.npmjs.org/:_authToken"
          pnpm --filter @ichintansoni/skills-master publish --no-git-checks --access public --provenance

      # GitHub Packages has no trusted-publishing equivalent, so this one stays on
      # a token — the per-run GITHUB_TOKEN, which is minted fresh and cannot expire.
      # pnpm logs "Skipped OIDC: ERR_PNPM_AUTH_TOKEN_EXCHANGE … 404" here before
      # falling back to it; on this step that warning is expected, not a failure.
      #
      # Credentials go in the *user-level* npmrc, never a project one. pnpm 11
      # deliberately refuses to expand env vars in registry credentials read from
      # a project .npmrc — that file is usually committed, so expanding it there
      # could leak the token to an attacker-controlled registry. Writing to the
      # project root silently produced "authentication token not provided".
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm config --location=user set "@ichintansoni:registry=https://npm.pkg.github.com"
          npm config --location=user set "//npm.pkg.github.com/:_authToken=$NODE_AUTH_TOKEN"
          pnpm --filter @ichintansoni/skills-master publish --no-git-checks

      # Tag via the Git refs API, NOT `git push`.
      #
      # GITHUB_TOKEN is a GitHub App token, and GitHub rejects a *push* whose ref
      # would create or update anything under .github/workflows/ without the
      # `workflows` permission — which the permissions: block above cannot grant.
      # A tag push is subject to that check against the tree it points at, so a
      # release whose commit is no longer main's tip gets rejected once main's
      # workflow files have moved on:
      #
      #   ! [remote rejected] v0.3.15 -> v0.3.15 (refusing to allow a GitHub App
      #     to create or update workflow `.github/workflows/release.yml` …)
      #
      # That is not hypothetical — it is why v0.3.15 is published to both
      # registries with no tag and no GitHub Release. Two merges landed 21s apart;
      # the second changed release.yml on main while the first release run was
      # still going, so by the time that run tagged, its own tree held an older
      # copy of the file. The commit being tagged never touched a workflow at all.
      # Two merges close together, either one touching .github/workflows/, is
      # enough — and Dependabot batches land exactly like that.
      #
      # Creating a ref that points at a commit already on the remote writes no file
      # content, so it is structurally not a workflow create-or-update and the
      # check does not apply. Annotated tag object first, then the ref, to match
      # the tags already in the repo. Refs created this way with GITHUB_TOKEN do
      # not trigger workflow runs, so this still cannot re-trigger release.yml.
      - name: Create tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" \
            -f message="chore(release): $TAG [skip ci]" \
            -f object="$GITHUB_SHA" \
            -f type=commit \
            --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$TAG_SHA" \
            --jq '"created " + .ref + " -> " + .object.sha'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            claude-marketplace.zip

      # A release can half-succeed: publish lands, then a later step fails and
      # leaves the registry ahead of the tags. That is not theoretical — 0.1.6,
      # 0.1.19 and 0.3.15 all reached npm with no tag, and 0.3.15 also has no
      # GitHub Release. Nothing noticed until someone compared the three by hand
      # weeks later. Assert they agree while the run is still on screen.
      #
      # `Compute next version` already recovers from this by baselining on
      # max(tag, npmjs) — that net stays. This reports the tear instead of
      # silently absorbing it.
      - name: Verify release consistency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          fail=0
          # npmjs can take a few seconds to reflect a fresh publish as `latest`.
          NPM_VER=""
          for _ in 1 2 3 4 5; do
            NPM_VER="$(npm view @ichintansoni/skills-master version \
              --registry=https://registry.npmjs.org 2>/dev/null || true)"
            [ "$NPM_VER" = "$VER" ] && break
            sleep 5
          done
          [ "$NPM_VER" = "$VER" ] \
            || { echo "::error::npmjs latest is '$NPM_VER', expected '$VER'"; fail=1; }
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 \
            || { echo "::error::tag $TAG is missing from origin"; fail=1; }
          gh release view "$TAG" >/dev/null 2>&1 \
            || { echo "::error::GitHub Release $TAG does not exist"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "npmjs, tag and GitHub Release all agree on $TAG"
