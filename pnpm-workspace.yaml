packages:
  - "packages/*"
allowBuilds:
  esbuild: true
# tsup 8.5.1 (latest) pins esbuild ^0.27.0, but every 0.27.x from 0.27.3 up
# carries GHSA-g7r4-m6w7-qqqr. esbuild ships breaking changes in minor 0.x
# bumps, so this forces tsup past its declared range deliberately: verified
# that the build succeeds and dist/bin.js is byte-identical either way.
# Remove this once tsup widens its range to ^0.28.
overrides:
  esbuild: ">=0.28.1"
  # gray-matter 4.0.3 locks js-yaml to 3.15.1, which carries GHSA-2883-xcg3-v3hh.
  # Patch release 3.15.2 fixes the CPU consumption vulnerability while preserving the 3.x API
  # (safeLoad/safeDump) required by gray-matter (which fails on js-yaml 4+ / 5+).
  js-yaml: "~3.15.2"
